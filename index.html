<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tâm's Bot Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe4;--ink:#2d2a32;--mut:#5f5a66;--card:#fffaf2;--line:#e4d8c6;--green:#2e9e5b;--gray:#8a8794;--amber:#d98a00;--red:#d0453a;--dim:#c9c5cf;--accent:#5b6fd6}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(255,250,242,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:1.15rem;margin:0 8px 0 0}
.meta{font-size:.82rem;color:var(--mut)}
.badge{font-size:.75rem;padding:2px 8px;border-radius:99px;background:#fde7b8;color:#7a4b00;font-weight:600}
.counter{font-weight:600;font-size:.9rem}
.chip,.btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
input[type=search]{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem;min-width:0;flex:1 1 140px;max-width:240px;background:#fff}
.spacer{flex:1}
main{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:1300px;margin:0 auto;position:relative}
@media(min-width:900px){main{grid-template-columns:2.2fr 1fr}}
#office{display:grid;gap:12px;grid-template-columns:1fr;position:relative}
@media(min-width:640px){#office{grid-template-columns:1fr 1fr}.room.wide{grid-column:span 2}}
.room{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 12px;overflow:hidden;box-shadow:0 2px 0 #e9dcc8}
.room h2{font-size:.92rem;margin:0 0 4px;display:flex;align-items:center;gap:6px}
.floor{position:absolute;inset:0;z-index:0;pointer-events:none}
.bots{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-around;padding-top:6px}
.bot{background:none;border:0;padding:4px;border-radius:14px;cursor:pointer;width:104px;text-align:center;transition:transform .15s}
.bot:hover{transform:translateY(-2px)}
.bot.hide{opacity:.18}
.bot svg{width:96px;height:96px;display:block;margin:auto}
.bot .nm{font-size:.74rem;font-weight:600;line-height:1.2;display:block;margin-top:2px}
.bot .tk{font-size:.68rem;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.light{transform-box:fill-box;transform-origin:center}
.pulse .light{animation:pulse 1s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.7);opacity:.6}}
.working .hands{animation:type .35s steps(2) infinite}
@keyframes type{50%{transform:translateY(1.5px)}}
.working .screen-line{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
aside .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
aside h3{margin:0 0 8px;font-size:.95rem}
.tray button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:1px solid #f1d59a;background:#fff7e6;border-radius:12px;padding:7px 9px;margin-bottom:6px;cursor:pointer;font-size:.83rem}
.feed{list-style:none;padding:0;margin:0;font-size:.8rem;max-height:280px;overflow:auto}
.feed li{padding:5px 0;border-bottom:1px dashed var(--line)}
.empty{color:var(--mut);font-size:.82rem;margin:0}
#lines{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
#lines path{fill:none;stroke:#5b6fd6;stroke-width:2;stroke-dasharray:3 5;opacity:.75}
#panel{position:fixed;z-index:40;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:18px;transition:transform .25s}
@media(min-width:700px){#panel{top:0;right:0;bottom:0;width:340px;transform:translateX(105%)}#panel.open{transform:none}}
@media(max-width:699px){#panel{left:0;right:0;bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%);max-height:70vh;overflow:auto}#panel.open{transform:none}}
#panel h3{margin:0 0 2px;font-size:1.15rem}
#panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.9rem}
#panel dt{color:var(--mut)}#panel dd{margin:0;font-weight:500}
.close{position:absolute;top:10px;right:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="row">
  <h1>🏢 Tâm's Bot Office</h1>
  <span class="counter" id="counter" aria-live="polite"></span>
  <span class="badge" id="offline" hidden>Offline</span>
  <span class="spacer"></span>
  <span class="meta" id="updated"></span>
  <button class="btn" id="refresh" aria-label="Làm mới dữ liệu">↻ Làm mới</button>
 </div>
 <div class="row" style="margin-top:8px" role="group" aria-label="Lọc theo trạng thái" id="chips"></div>
 <div class="row" style="margin-top:8px">
  <input type="search" id="q" placeholder="Tìm bot…" aria-label="Tìm bot theo tên">
  <button class="chip" id="toggleLines" aria-pressed="false">┄ Đường báo cáo</button>
 </div>
</header>
<main>
 <div style="position:relative">
  <section id="office" aria-label="Văn phòng"></section>
  <svg id="lines" aria-hidden="true" hidden></svg>
 </div>
 <aside>
  <div class="card tray"><h3>🙋 Cần anh <span id="trayN"></span></h3><div id="tray"></div></div>
  <div class="card"><h3>📰 Hoạt động</h3><ul class="feed" id="feed" aria-live="polite"></ul></div>
 </aside>
</main>
<div id="panel" role="dialog" aria-modal="false" aria-labelledby="pName" tabindex="-1">
 <button class="btn close" id="pClose" aria-label="Đóng">✕</button>
 <h3 id="pName"></h3><div class="meta" id="pRole"></div>
 <dl style="margin-top:14px"><dt>Trạng thái</dt><dd id="pStatus"></dd><dt>Việc hiện tại</dt><dd id="pTask"></dd><dt>Báo cáo cho</dt><dd id="pRep"></dd><dt>Phòng</dt><dd id="pRoom"></dd></dl>
</div>
<script>
const DATA_URL='./bots.json';
const POLL=60000;
const ST={working:{l:'Đang làm',c:'var(--green)',h:'#2e9e5b'},idle:{l:'Rảnh',c:'var(--gray)',h:'#8a8794'},waiting:{l:'Chờ anh',c:'var(--amber)',h:'#e6a100'},blocked:{l:'Bị chặn',c:'var(--red)',h:'#d0453a'},unknown:{l:'Không rõ',c:'var(--dim)',h:'#d6d3dc'}};
const ROOMS=[
 {id:'swiftgas',n:'SwiftGas Team Room',e:'⛽',wide:true,fl:'#e8eefc'},
 {id:'library',n:'Research Library',e:'📚',fl:'#f3e9dc'},
 {id:'projects',n:'Projects Wing',e:'🌱',fl:'#e8f4e6'},
 {id:'commerce',n:'Commerce Corner',e:'🛍️',fl:'#fdeee2'},
 {id:'lobby',n:'Lobby',e:'🛋️',fl:'#f1ecf8'}];
// Roster: built-in defaults; also the sample fallback.
const ROSTER=[
 {id:'bpm',name:'Product BPM',role:'Trưởng nhóm sản phẩm SwiftGas',room:'swiftgas',reportsTo:'tam',skin:'#f2c9a5',shirt:'#5b6fd6',prop:'lead'},
 {id:'dev',name:'Dev · Senior SWE',role:'Lập trình viên chính SwiftGas',room:'swiftgas',reportsTo:'bpm',skin:'#e8b88f',shirt:'#3a9d8f',prop:'code'},
 {id:'qc',name:'QC Engineer',role:'Kiểm thử chất lượng',room:'swiftgas',reportsTo:'bpm',skin:'#f5d3b5',shirt:'#c76b98',prop:'qc'},
 {id:'scout',name:'Scout',role:'Nghiên cứu & tài liệu',room:'library',reportsTo:'tam',skin:'#d9a57c',shirt:'#8a6bd1',prop:'books'},
 {id:'cafe',name:'Café Manager',role:'Quản lý quán cà phê',room:'projects',reportsTo:'tam',skin:'#f0c6a0',shirt:'#9b6a43',prop:'coffee'},
 {id:'farm',name:'Farm Manager',role:'Quản lý trang trại',room:'projects',reportsTo:'tam',skin:'#e3b18a',shirt:'#5fa04e',prop:'farm'},
 {id:'fabric',name:'Fabric',role:'Dự án vải & may mặc',room:'projects',reportsTo:'tam',skin:'#f4cfae',shirt:'#e07a5f',prop:'fabric'},
 {id:'dino',name:'Dino',role:'Bán hàng lại trên Shopee',room:'commerce',reportsTo:'tam',skin:'#9fd39a',shirt:'#ee4d2d',prop:'parcel'},
 {id:'chotot',name:'ChoTot Assistant',role:'Quản lý tin đăng Chợ Tốt',room:'commerce',reportsTo:'tam',skin:'#f1c8a3',shirt:'#f5b400',prop:'board'},
 {id:'grok',name:'Grok Bot',role:'Trợ lý tổng hợp',room:'lobby',reportsTo:'tam',skin:'#cfd6e4',shirt:'#2d2a32',prop:'grok'},
 {id:'egg',name:'dr eggbot',role:'Thiết kế bot mới',room:'lobby',reportsTo:'tam',skin:'#fff3d6',shirt:'#f2f2f2',prop:'egg'}];
const SAMPLE={updatedAt:null,bots:ROSTER.map(b=>({id:b.id,status:{dev:'working',bpm:'waiting',scout:'working'}[b.id]||'idle',currentTask:{dev:'PR merge master vào develop',bpm:'Chờ anh duyệt PR #94',scout:'Dựng Bot Office'}[b.id]||''}))};
let bots=ROSTER.map(b=>({...b,status:'unknown',currentTask:''}));
let updatedAt=null,lastOk=null,hasData=false,filter='all',query='',showLines=false,feed=[],openId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=id=>id==='tam'?'Tâm':(bots.find(b=>b.id===id)?.name||id||'—');

function propSVG(p){
 const m={
 lead:`<rect x="4" y="8" width="26" height="18" rx="2" fill="#fff" stroke="#b9b3c4"/><path d="M8 20l5-5 4 3 7-7" stroke="#5b6fd6" stroke-width="2" fill="none"/><rect x="30" y="66" width="60" height="16" rx="4" fill="#b98a5e"/><rect x="30" y="66" width="60" height="5" rx="2" fill="#cfa275"/>`,
 code:`<rect x="18" y="52" width="28" height="18" rx="2" fill="#2d2a32"/><rect x="50" y="52" width="28" height="18" rx="2" fill="#2d2a32"/><g class="screen-line"><rect x="21" y="56" width="14" height="2" fill="#7ee0a1"/><rect x="21" y="61" width="20" height="2" fill="#8ab4ff"/><rect x="53" y="56" width="18" height="2" fill="#ffd36e"/><rect x="53" y="61" width="12" height="2" fill="#7ee0a1"/></g><rect x="22" y="72" width="52" height="12" rx="3" fill="#b98a5e"/>`,
 qc:`<rect x="70" y="40" width="20" height="26" rx="2" fill="#fff" stroke="#b9b3c4"/><path d="M73 47l2 2 4-4M73 55l2 2 4-4" stroke="#2e9e5b" stroke-width="1.6" fill="none"/><circle cx="16" cy="58" r="7" fill="#dff1ff" stroke="#5f5a66" stroke-width="2.5"/><path d="M21 63l6 6" stroke="#5f5a66" stroke-width="3" stroke-linecap="round"/>`,
 books:`<rect x="2" y="30" width="16" height="54" fill="#a8774f"/><rect x="4" y="34" width="4" height="12" fill="#e07a5f"/><rect x="9" y="33" width="4" height="13" fill="#5b6fd6"/><rect x="4" y="52" width="5" height="12" fill="#5fa04e"/><rect x="10" y="51" width="4" height="13" fill="#f5b400"/><rect x="62" y="70" width="18" height="6" rx="1" fill="#8a6bd1"/><rect x="64" y="65" width="16" height="5" rx="1" fill="#f2c94c"/>`,
 coffee:`<rect x="72" y="44" width="20" height="30" rx="3" fill="#6b6f7a"/><rect x="76" y="50" width="12" height="7" rx="1" fill="#2d2a32"/><rect x="78" y="63" width="8" height="8" rx="1" fill="#fff"/><path d="M80 60c0-3 3-3 3-6" stroke="#c9c5cf" stroke-width="1.5" fill="none"/>`,
 farm:`<path d="M10 84v-16M10 72c-6-2-6-8 0-8M10 70c6-2 6-8 0-8" stroke="#5fa04e" stroke-width="3" fill="none"/><rect x="4" y="80" width="12" height="8" rx="2" fill="#c97b4a"/><text x="70" y="62" font-size="13">🐔</text><text x="72" y="80" font-size="13">🐷</text>`,
 fabric:`<circle cx="80" cy="74" r="9" fill="#e07a5f"/><path d="M73 70q7 4 14 0M73 77q7 4 14 0" stroke="#fff" stroke-width="1.2" fill="none"/><rect x="6" y="62" width="18" height="20" rx="2" fill="#81c3d7"/><path d="M6 68h18M6 74h18" stroke="#fff" stroke-dasharray="2 2"/>`,
 parcel:`<rect x="4" y="66" width="18" height="16" rx="2" fill="#d9a066"/><path d="M13 66v16" stroke="#b07d47" stroke-width="2"/><rect x="8" y="54" width="14" height="12" rx="2" fill="#e3b07a"/><rect x="68" y="20" width="26" height="12" rx="3" fill="#ee4d2d"/><text x="81" y="29" font-size="7" fill="#fff" text-anchor="middle" font-weight="700">SHOP</text>`,
 board:`<rect x="66" y="34" width="28" height="34" rx="2" fill="#fff4c2" stroke="#d9b54a"/><rect x="69" y="38" width="10" height="8" fill="#81c3d7"/><rect x="81" y="38" width="10" height="8" fill="#f4a3a3"/><rect x="69" y="49" width="10" height="8" fill="#a3d9a5"/><rect x="81" y="49" width="10" height="8" fill="#d7b4f3"/>`,
 grok:`<rect x="70" y="66" width="22" height="16" rx="6" fill="#9fc5a8"/><circle cx="10" cy="70" r="8" fill="#5fa04e"/><rect x="7" y="74" width="6" height="10" fill="#c97b4a"/>`,
 egg:`<rect x="66" y="70" width="28" height="14" rx="4" fill="#f2b6a0"/><path d="M66 70a14 12 0 0 1 28 0" fill="#dff1ff" opacity=".8" stroke="#a7c4dd"/><ellipse cx="80" cy="68" rx="6" ry="8" fill="#fff3d6" stroke="#e6c98f"/>`};
 return m[p]||'';
}
function botSVG(b){
 const s=ST[b.status]||ST.unknown;
 const head=b.prop==='egg'?`<ellipse cx="48" cy="38" rx="15" ry="18" fill="${b.skin}" stroke="#e6c98f"/>`:b.prop==='grok'?`<rect x="33" y="22" width="30" height="30" rx="10" fill="${b.skin}"/><rect x="46" y="14" width="4" height="8" fill="#5f5a66"/><circle cx="48" cy="13" r="3" fill="#5b6fd6"/>`:`<circle cx="48" cy="38" r="15" fill="${b.skin}"/><path d="M33 35a15 15 0 0 1 30 0q-8-7-15-4q-8-3-15 4" fill="#3b2f2f"/>`;
 return `<svg viewBox="0 0 96 96" aria-hidden="true">
 <ellipse cx="48" cy="88" rx="30" ry="5" fill="#000" opacity=".08"/>
 ${propSVG(b.prop)}
 <path d="M30 80q0-22 18-22t18 22z" fill="${b.shirt}"/>
 ${head}
 <circle cx="42" cy="39" r="1.8" fill="#2d2a32"/><circle cx="54" cy="39" r="1.8" fill="#2d2a32"/>
 <path d="M42 45q6 5 12 0" stroke="#2d2a32" stroke-width="1.8" fill="none" stroke-linecap="round"/>
 <circle cx="38" cy="44" r="2.5" fill="#f28b82" opacity=".45"/><circle cx="58" cy="44" r="2.5" fill="#f28b82" opacity=".45"/>
 <g class="hands"><circle cx="35" cy="73" r="4" fill="${b.skin}"/><circle cx="61" cy="73" r="4" fill="${b.skin}"/></g>
 <circle class="light" cx="48" cy="9" r="5" fill="${s.h}" stroke="#fff" stroke-width="2"/>
 </svg>`;
}
function floorSVG(r){return `<svg class="floor" preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${r.fl}"/><path d="M0 100L100 0" stroke="#fff" stroke-width=".4" opacity=".6"/><g stroke="#fff" stroke-width=".3" opacity=".5">${Array.from({length:10},(_,i)=>`<path d="M${i*10} 0V100M0 ${i*10}H100"/>`).join('')}</g></svg>`}

function buildOffice(){
 $('office').innerHTML=ROOMS.map(r=>`<section class="room${r.wide?' wide':''}" aria-labelledby="rm-${r.id}">${floorSVG(r)}<h2 id="rm-${r.id}" style="position:relative;z-index:1">${r.e} ${esc(r.n)}</h2><div class="bots" id="room-${r.id}"></div></section>`).join('');
 $('chips').innerHTML=[['all','Tất cả',null],...Object.entries(ST).map(([k,v])=>[k,v.l,v.c])].map(([k,l,c])=>`<button class="chip" data-f="${k}" aria-pressed="${k===filter}">${c?`<span class="dot" style="background:${c}"></span>`:''}${l}</button>`).join('');
 $('chips').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;[...$('chips').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===filter));render()};
}
function render(){
 ROOMS.forEach(r=>{const el=$('room-'+r.id);el.innerHTML=''});
 bots.forEach(b=>{
  const room=$('room-'+(ROOMS.some(r=>r.id===b.room)?b.room:'lobby'));
  const s=ST[b.status]||ST.unknown;
  const vis=(filter==='all'||b.status===filter)&&(!query||b.name.toLowerCase().includes(query));
  const btn=document.createElement('button');
  btn.className=`bot ${b.status}${vis?'':' hide'}${b._pulse?' pulse':''}`;btn.id='bot-'+b.id;btn.dataset.id=b.id;
  btn.setAttribute('aria-label',`${b.name}, ${s.l}${b.currentTask?', '+b.currentTask:''}`);
  btn.innerHTML=botSVG(b)+`<span class="nm">${esc(b.name)}</span><span class="tk">${esc(b.currentTask||s.l)}</span>`;
  btn.onclick=()=>openPanel(b.id);room.appendChild(btn);
 });
 const w=bots.filter(b=>b.status==='working').length,wt=bots.filter(b=>b.status==='waiting');
 $('counter').textContent=`${w} đang làm · ${wt.length} chờ anh`;
 $('trayN').textContent=wt.length?`(${wt.length})`:'';
 $('tray').innerHTML=wt.length?wt.map(b=>`<button data-id="${b.id}"><span class="dot" style="background:var(--amber)"></span><span><b>${esc(b.name)}</b><br><span class="meta">${esc(b.currentTask||'Đang chờ anh')}</span></span></button>`).join(''):'<p class="empty">Không có bot nào đang chờ anh 🎉</p>';
 $('tray').querySelectorAll('button').forEach(x=>x.onclick=()=>{const t=$('bot-'+x.dataset.id);t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'});t.focus();openPanel(x.dataset.id)});
 $('feed').innerHTML=feed.length?feed.map(f=>`<li><span class="meta">${f.t}</span> · <b>${esc(f.n)}</b>: ${f.a} → ${f.b}${f.k?` — ${esc(f.k)}`:''}</li>`).join(''):'<li class="empty">Chưa có thay đổi nào.</li>';
 bots.forEach(b=>b._pulse=false);
 if(openId)fillPanel(openId);
 drawLines();tick();
}
function drawLines(){
 const svg=$('lines');svg.hidden=!showLines;if(!showLines)return;
 const base=svg.parentElement.getBoundingClientRect();
 const c=id=>{const e=$('bot-'+id);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.left-base.left+r.width/2,y:r.top-base.top+30}};
 let d='';bots.forEach(b=>{if(b.reportsTo&&b.reportsTo!=='tam'){const a=c(b.id),t=c(b.reportsTo);if(a&&t)d+=`M${a.x} ${a.y}Q${(a.x+t.x)/2} ${Math.min(a.y,t.y)-40} ${t.x} ${t.y}`}});
 const bpm=c('bpm');svg.innerHTML=`<path d="${d}"/>`+(bpm?`<path d="M${bpm.x} ${bpm.y-20}V${bpm.y-34}"/><text x="${bpm.x+6}" y="${bpm.y-24}" font-size="11" fill="#5b6fd6" font-weight="600">→ Tâm</text>`:'');
}
function fillPanel(id){const b=bots.find(x=>x.id===id);if(!b)return;const s=ST[b.status]||ST.unknown;
 $('pName').textContent=b.name;$('pRole').textContent=b.role||'';$('pStatus').innerHTML=`<span class="dot" style="background:${s.c}"></span> ${s.l}`;$('pTask').textContent=b.currentTask||'—';$('pRep').textContent=nameOf(b.reportsTo);$('pRoom').textContent=ROOMS.find(r=>r.id===b.room)?.n||b.room}
function openPanel(id){openId=id;fillPanel(id);$('panel').classList.add('open');$('pClose').focus()}
function closePanel(){const id=openId;openId=null;$('panel').classList.remove('open');$('bot-'+id)?.focus()}
$('pClose').onclick=closePanel;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closePanel()});

function validate(j){
 if(!j||typeof j!=='object'||!Array.isArray(j.bots))throw new Error('bad shape');
 return {updatedAt:typeof j.updatedAt==='string'?j.updatedAt:null,bots:j.bots.filter(b=>b&&typeof b.id==='string').map(b=>({id:b.id,name:typeof b.name==='string'?b.name:undefined,role:typeof b.role==='string'?b.role:undefined,room:typeof b.room==='string'?b.room:undefined,status:ST[b.status]?b.status:'unknown',currentTask:typeof b.currentTask==='string'?b.currentTask.slice(0,200):'',reportsTo:typeof b.reportsTo==='string'?b.reportsTo:undefined}))};
}
function apply(d){
 const map=new Map(d.bots.map(b=>[b.id,b]));
 const now=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
 const ids=new Set(ROSTER.map(r=>r.id));d.bots.forEach(b=>ids.add(b.id));
 bots=[...ids].map(id=>{
  const base=ROSTER.find(r=>r.id===id)||{id,name:id,role:'',room:'lobby',reportsTo:'tam',skin:'#f2c9a5',shirt:'#9aa5b1',prop:''};
  const prev=bots.find(b=>b.id===id),f=map.get(id);
  const nb={...base,...Object.fromEntries(Object.entries(f||{}).filter(([,v])=>v!==undefined)),status:f?f.status:'unknown',currentTask:f?f.currentTask:''};
  if(hasData&&prev&&prev.status!==nb.status){nb._pulse=true;feed.unshift({t:now,n:nb.name,a:ST[prev.status].l,b:ST[nb.status].l,k:nb.currentTask})}
  return nb});
 feed=feed.slice(0,20);updatedAt=d.updatedAt;hasData=true;
}
async function load(){
 try{const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
  apply(validate(await r.json()));lastOk=Date.now();$('offline').hidden=true;
 }catch(e){$('offline').hidden=false;if(!hasData){apply(SAMPLE);updatedAt=null}}
 render();
}
function tick(){const t=updatedAt?Date.parse(updatedAt):lastOk;if(!t){$('updated').textContent='Dữ liệu mẫu';return}
 const m=Math.max(0,Math.round((Date.now()-t)/60000));$('updated').textContent=m<1?'Cập nhật vừa xong':`Cập nhật ${m} phút trước`}
$('refresh').onclick=load;
$('q').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
$('toggleLines').onclick=e=>{showLines=!showLines;e.currentTarget.setAttribute('aria-pressed',showLines);drawLines()};
addEventListener('resize',drawLines);
buildOffice();render();load();setInterval(load,POLL);setInterval(tick,30000);
</script>
</body>
</html>
